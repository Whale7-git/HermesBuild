name: HermesBuild iOS CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Isolate main commits so later pushes cannot replace a queued version run.
concurrency:
  group: hermes-public-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source integrity, version plan and SwiftUI guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect new main release identity
        id: plan
        run: python3 scripts/release-plan.py
      - name: Verify exact source inventory
        run: python3 tests/verify_source.py
      - name: Check SwiftUI modifiers and release automation
        run: |
          python3 tests/check_swiftui_modifiers.py
          python3 tests/test_swiftui_modifiers.py
          python3 -m unittest discover -s tests/releaseautomation -p 'test_*.py' -v

  offline:
    name: Swift offline regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report preinstalled Swift
        run: |
          command -v swift
          swift --version
      - name: Run complete offline suite
        env:
          HERMES_TEST_JOBS: "4"
        run: bash tests/run_container.sh

  ios:
    name: Build verified IPA and publish new main version
    if: >-
      ${{ needs.source.result == 'success' && needs.offline.result == 'success' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.source.outputs.release == 'true')) }}
    needs: [source, offline]
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ${{ github.event_name == 'push' && format('hermes-release-{0}', needs.source.outputs.tag) || format('hermes-build-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject an existing or conflicting release before compiling
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-publish-release.sh --preflight
      - name: Report default Apple toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Compile once and validate the checked-out source
        env:
          PR_HEAD_SHA: ${{ github.sha }}
          HERMES_SOURCE_VERIFIED_SHA: ${{ github.sha }}
        run: bash scripts/github-build-ipa.sh
      - name: Upload, verify and publish directly from this runner
        id: publish
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.source.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-publish-release.sh
      - name: Record manual build result
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo 'Manual build and IPA verification passed. No Release was requested; package remains on the ephemeral runner.' >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Bark release result
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (needs.source.outputs.release == 'true' || needs.source.result == 'failure' || needs.offline.result == 'failure') }}
    needs: [source, offline, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Notify release success or failure without exposing the Bark key
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          HERMES_RELEASE_URL: ${{ needs.ios.outputs.release_url }}
          HERMES_RELEASE_RESULT: ${{ needs.ios.result }}
        run: |
          if [[ "$HERMES_RELEASE_RESULT" == success && -n "$HERMES_RELEASE_URL" ]]; then
            bash ci/notify-release-bark.sh success
          else
            bash ci/notify-release-bark.sh failure
          fi

name: HermesShell source checks and iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  source:
    name: Source integrity and SwiftUI guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact source inventory
        run: python3 tests/verify_source.py
      - name: Check SwiftUI modifiers
        run: |
          python3 tests/check_swiftui_modifiers.py
          python3 tests/test_swiftui_modifiers.py

  offline:
    name: Swift offline regression
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.1"
      - name: Run complete offline suite
        env:
          HERMES_TEST_JOBS: "4"
        run: bash tests/run_container.sh

  ios:
    name: Manual unsigned iPhoneOS IPA
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [source, offline]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build and validate exact checked-out source
        env:
          PR_HEAD_SHA: ${{ github.sha }}
        run: bash scripts/github-build-ipa.sh
      - name: Store verified unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: HermesShell-unsigned-${{ github.sha }}
          path: |
            release/*.ipa
            release/build-info.json
            release/validation.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

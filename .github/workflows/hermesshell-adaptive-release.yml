name: HermesShell Adaptive CI and Xcode Release

on:
  # Also run a preflight when this workflow definition itself changes.
  # Ordinary HermesBuild source commits do not trigger this pipeline.
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermesshell-adaptive-release.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private HermesShell branch, tag, or commit SHA to validate"
        required: true
        default: "main"
        type: string
      publish_release:
        description: "Publish the verified IPA to the private HermesShell Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hermesshell-adaptive-release
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve exact private source commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
    steps:
      - name: Guard release source selection
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'ci/build165-preflight-fixes' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$SOURCE_REF" != "main" ]]; then
            echo "::error::Release publication is allowed only from HermesBuild main using HermesShell main"
            exit 1
          fi

      - name: Checkout private HermesShell source
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesShell
          ref: ${{ inputs.source_ref || 'ci/build165-preflight-fixes' }}
          token: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Resolve immutable source identity
        id: identity
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Source identity"
            echo
            echo "- Commit: $sha"
            echo "- Requested ref: $SOURCE_REF"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          version, build = data.get("version"), data.get("build")
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Invalid release version in release.json")
          if not isinstance(build, str) or not re.fullmatch(r"[0-9]+", build):
              raise SystemExit("Invalid build number in release.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"build={build}\n")
          print(f"Release metadata: {version} / build {build}")
          PY

  source-gate:
    name: Python source gate and SwiftUI static guard
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact verified source commit
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesShell
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify release scope, source inventory and SHA256
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/source-gate.log"
          if python3 tests/verify_source.py >"$log" 2>&1; then
            echo "SOURCE_GATE=PASS"
          else
            rc=$?
            reason="$(grep -m1 '^SOURCE_GATE_FAILED:' "$log" || true)"
            label="SOURCE_GATE_FAILURE"
            case "$reason" in
              *"README release mismatch"*) label="README_RELEASE_MISMATCH";;
              *"source content drifted"*) label="SOURCE_SHA256_MISMATCH";;
              *"scope mismatch"*) label="RELEASE_SCOPE_MISMATCH";;
              *"Info.plist release mismatch"*) label="INFO_PLIST_VERSION_MISMATCH";;
              *"baseline changed"*) label="IMMUTABLE_BASELINE_MISMATCH";;
            esac
            echo "::error::Python source gate failed ($label). Private details are suppressed."
            exit "$rc"
          fi

      - name: Run SwiftUI modifier static guard
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/swiftui-guard.log"
          if python3 tests/check_swiftui_modifiers.py >"$log" 2>&1; then
            cat "$log"
          else
            echo "::error::SwiftUI modifier guard failed. Source diagnostics are suppressed because this workflow runs in a public repository."
            exit 1
          fi

      - name: Test SwiftUI modifier guard positive and negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/swiftui-unit.log"
          if python3 -m unittest discover -s tests -p 'test_swiftui_modifiers.py' >"$log" 2>&1; then
            tail -n 3 "$log"
          else
            echo "::error::SwiftUI guard unit tests failed. Detailed source diagnostics are suppressed."
            exit 1
          fi

      - name: Write source gate summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Source gate"
            echo
            echo "- Python release/source gate: PASS"
            echo "- SHA256 and release scope: PASS"
            echo "- SwiftUI static guard: PASS"
            echo "- SwiftUI guard regression fixtures: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  offline-regression:
    name: Full Linux Swift offline regression
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HERMES_TEST_JOBS: "4"
    steps:
      - name: Checkout exact verified source commit
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesShell
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Set up Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run complete offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          swift --version | head -n 1
          log="$RUNNER_TEMP/hermes-offline-regression.log"
          trace="$RUNNER_TEMP/hermes-offline-trace.log"
          started="$(date +%s)"
          if bash -x tests/run_container.sh >"$log" 2>"$trace"; then
            finished="$(date +%s)"
            duration=$((finished - started))
            grep -E '^==>|^HERMES_OFFLINE_TESTS_PASS$' "$log" | tail -n 20
            echo "OFFLINE_REGRESSION_SECONDS=$duration" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -q '^HERMES_OFFLINE_TESTS_PASS$' "$log"
            {
              echo
              echo "## Full offline regression"
              echo
              echo "- Result: PASS"
              echo "- Duration: $duration seconds"
              echo "- Swift toolchain: $(swift --version | head -n 1)"
              echo "- Test runner: tests/run_container.sh"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            python3 - "$log" "$trace" <<'PY'
          import re, sys
          from pathlib import Path
          output = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          trace = Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")
          compiling = re.findall(r"(?m)^FAIL: compile ([A-Za-z0-9_-]+)$", output)
          running = re.findall(r"(?m)^\++\s+stdbuf -oL \S+/([A-Za-z0-9_-]+)\s*$", trace)
          serial = re.findall(r"(?m)^\++\s+bash (tests/[A-Za-z0-9_/-]+/run(?:_local)?\.sh)\s*$", trace)
          if compiling:
              print("FAILED_COMPILE_SUITE=" + compiling[-1])
          if running:
              print("LAST_EXECUTED_SUITE=" + running[-1])
          if serial:
              print("LAST_SERIAL_TEST_SCRIPT=" + serial[-1])
          if not (compiling or running or serial):
              print("FAILED_PHASE=BEFORE_SUITE_EXECUTION_OR_UNKNOWN")
          PY
            echo "::error::Full offline regression failed (exit $rc). Only safe test identifiers are shown; private compiler/test diagnostics were suppressed."
            exit "$rc"
          fi

  xcode-build-release:
    name: Xcode iPhoneOS IPA build and optional private Release
    needs: [resolve-source, source-gate, offline-regression]
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      ipa_name: ${{ steps.verify.outputs.ipa_name }}
      ipa_sha256: ${{ steps.verify.outputs.ipa_sha256 }}
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - name: Checkout exact source commit that passed both Ubuntu jobs
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesShell
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Select and verify Xcode 26.3 and iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_26.3.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "::error::Xcode 26.3 is not installed on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$developer_dir"
          version="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          [[ "$version" == "26.3" ]] || { echo "::error::Unexpected Xcode version: $version"; exit 1; }
          echo "XCODE_VERSION=$version"
          echo "IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Build and verify unsigned iPhoneOS IPA
        id: verify
        shell: bash
        env:
          PR_HEAD_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/hermesshell-xcode-build.log"
          started="$(date +%s)"
          set +e
          PR_HEAD_SHA="$PR_HEAD_SHA" bash scripts/github-build-ipa.sh >"$private_log" 2>&1
          rc=$?
          set -e
          finished="$(date +%s)"
          duration=$((finished - started))
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Xcode build or IPA verification failed (exit $rc). Private compiler diagnostics were suppressed from public logs."
            exit "$rc"
          fi

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          version, build = release["version"], release["build"]
          validation = json.loads(Path("release/validation.json").read_text(encoding="utf-8"))
          info = json.loads(Path("release/build-info.json").read_text(encoding="utf-8"))
          source_sha = os.environ["PR_HEAD_SHA"]
          expected = {"version": version, "build": build, "bundle": "com.whale7.hermes", "arch": "arm64", "unsigned": True}
          for key, value in expected.items():
              assert validation.get(key) == value, (key, validation.get(key), value)
          assert info.get("head_commit") == source_sha
          assert info.get("source_head_commit") == source_sha
          assert info.get("working_tree") == "clean"
          ipa = Path("release") / validation["ipa"]
          assert ipa.is_file() and ipa.stat().st_size == validation["ipa_bytes"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ipa_name={ipa.name}\n")
              output.write(f"ipa_sha256={validation['sha256']}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n## Xcode IPA validation\n\n")
              summary.write("| Check | Result |\n|---|---|\n")
              summary.write(f"| Version | {version} / build {build} |\n")
              summary.write(f"| IPA | {ipa.name} |\n")
              summary.write(f"| Size | {validation['ipa_bytes']:,} bytes |\n")
              summary.write(f"| SHA-256 | {validation['sha256']} |\n")
              summary.write(f"| Bundle ID | {validation['bundle']} |\n")
              summary.write(f"| Architecture | {validation['arch']} |\n")
              summary.write("| Signing | Unsigned |\n")
              summary.write("| Source provenance | PASS |\n")
          print("IPA_VERIFICATION=PASS")
          print("IPA_NAME=" + ipa.name)
          print("IPA_SHA256=" + validation["sha256"])
          PY
          echo "XCODE_BUILD_SECONDS=$duration" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish verified IPA to private HermesShell Release
        id: publish
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$SOURCE_REF" != "main" ]]; then
            echo "::error::Release publication is allowed only from HermesBuild main using HermesShell main"
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::HERMESSHELL_READ_RELEASE_TOKEN is missing"
            exit 1
          fi
          command -v gh >/dev/null 2>&1 || brew install gh

          version="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          build="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["build"])')"
          tag="release-$version-build$build"
          ipa="release/Hermes-$version-build$build-unsigned.ipa"
          [[ -s "$ipa" ]] || { echo "::error::Verified IPA is missing"; exit 1; }
          (cd release && shasum -a 256 -c SHA256SUMS.txt)

          if gh release view "$tag" --repo Whale7-git/HermesShell >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite an existing release"
            exit 1
          fi
          if gh api "repos/Whale7-git/HermesShell/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Git tag $tag already exists; refusing to reuse it"
            exit 1
          fi

          notes="$RUNNER_TEMP/hermesshell-release-notes.md"
          cat >"$notes" <<EOF
          Hermes $version / build $build

          - Built for iPhoneOS arm64 with Xcode 26.3 and Apple's iPhoneOS SDK.
          - Unsigned IPA for SideStore re-signing.
          - Python source gate and full Linux Swift offline regression passed for the same source commit.
          - IPA architecture, bundle identifier, version, build number and SHA-256 verified.
          - Source commit: $SOURCE_SHA
          - IPA SHA-256: $(shasum -a 256 "$ipa" | awk '{print $1}')
          - Build workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          gh release create "$tag" "$ipa" release/build-info.json release/validation.json release/SHA256SUMS.txt \
            --repo Whale7-git/HermesShell --target "$SOURCE_SHA" \
            --title "Hermes $version / build $build" --notes-file "$notes" --latest

          gh api "repos/Whale7-git/HermesShell/releases/tags/$tag" >"$RUNNER_TEMP/private-release-verified.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path(os.environ["RUNNER_TEMP"], "private-release-verified.json").read_text(encoding="utf-8"))
          validation = json.loads(Path("release/validation.json").read_text(encoding="utf-8"))
          ipa = Path("release") / validation["ipa"]
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          expected_names = {ipa.name, "build-info.json", "validation.json", "SHA256SUMS.txt"}
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          missing = expected_names - assets.keys()
          assert not missing, f"Missing Release assets: {sorted(missing)}"
          assert assets[ipa.name].get("digest") == "sha256:" + digest
          assert assets[ipa.name]["size"] == ipa.stat().st_size
          assert release["draft"] is False and release["prerelease"] is False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_url={release['html_url']}\n")
          print("PRIVATE_RELEASE_UPLOAD=VERIFIED")
          print("PRIVATE_RELEASE_URL=" + release["html_url"])
          print("PRIVATE_RELEASE_IPA_SHA256=" + digest)
          PY

      - name: Build and release summary
        if: success()
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          {
            echo
            echo "## Pipeline"
            echo
            echo "- Exact source commit: $SOURCE_SHA"
            echo "- Python source gate: PASS"
            echo "- Linux Swift offline regression: PASS"
            echo "- Xcode iPhoneOS IPA build and verification: PASS"
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "- Private HermesShell Release: PUBLISHED"
            else
              echo "- Private HermesShell Release: NOT REQUESTED (preflight mode)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Bark notification
    if: always()
    needs: [resolve-source, source-gate, offline-regression, xcode-build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify only on release success or pipeline failure
        shell: bash
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.version }}
          SOURCE_BUILD: ${{ needs.resolve-source.outputs.build }}
          RELEASE_URL: ${{ needs.xcode-build-release.outputs.release_url }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RESOLVE_RESULT: ${{ needs.resolve-source.result }}
          SOURCE_GATE_RESULT: ${{ needs.source-gate.result }}
          REGRESSION_RESULT: ${{ needs.offline-regression.result }}
          BUILD_RESULT: ${{ needs.xcode-build-release.result }}
        run: |
          set -euo pipefail
          if [[ -z "$BARK_URL" ]]; then
            echo "::warning::BARK_URL is not configured in HermesBuild Actions secrets; notification skipped"
            exit 0
          fi
          version="$SOURCE_VERSION"
          build="$SOURCE_BUILD"
          if [[ -z "$version" ]]; then version="unknown"; fi
          if [[ -z "$build" ]]; then build="unknown"; fi
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "$PUBLISH_RELEASE" == "true" && "$RESOLVE_RESULT" == "success" && "$SOURCE_GATE_RESULT" == "success" && "$REGRESSION_RESULT" == "success" && "$BUILD_RESULT" == "success" ]]; then
            title="HermesShell 正式发布成功"
            body="v$version build $build IPA 已发布"
            target="$RELEASE_URL"
            if [[ -z "$target" ]]; then target="https://github.com/Whale7-git/HermesShell/releases"; fi
          elif [[ "$RESOLVE_RESULT" == "failure" || "$SOURCE_GATE_RESULT" == "failure" || "$REGRESSION_RESULT" == "failure" || "$BUILD_RESULT" == "failure" || "$RESOLVE_RESULT" == "cancelled" || "$SOURCE_GATE_RESULT" == "cancelled" || "$REGRESSION_RESULT" == "cancelled" || "$BUILD_RESULT" == "cancelled" ]]; then
            title="HermesShell CI 构建失败"
            body="v$version build $build，请检查 GitHub Actions"
            target="$run_url"
          else
            echo "Preflight and Xcode build passed; no Release requested, success Bark skipped."
            exit 0
          fi

          response="$RUNNER_TEMP/bark-response.json"
          set +e
          http_code="$(curl --silent --max-time 20 --retry 1 --request POST --data-urlencode "title=$title" --data-urlencode "body=$body" --data-urlencode "url=$target" --data-urlencode "group=hermes-ci" --output "$response" --write-out '%{http_code}' "$BARK_URL")"
          curl_rc=$?
          set -e
          if [[ "$curl_rc" -ne 0 || "$http_code" != "200" ]]; then
            echo "::warning::Bark delivery failed (curl=$curl_rc http=$http_code)"
            exit 0
          fi
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if data.get("code") != 200:
              raise SystemExit("Bark did not confirm success")
          print("BARK_NOTIFICATION=SUCCESS")
          PY

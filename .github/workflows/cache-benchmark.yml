name: macOS DerivedData cache benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compare one commit with itself, or a direct child with its parent
        type: choice
        options:
          - same
          - adjacent
        default: same
      seed_sha:
        description: Full parent commit SHA; required only for adjacent mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-deriveddata-cache-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold:
    name: Cold build and save cache
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      build_seconds: ${{ steps.benchmark.outputs.build_seconds }}
      deriveddata_kib: ${{ steps.benchmark.outputs.deriveddata_kib }}
      deriveddata_bytes: ${{ steps.benchmark.outputs.deriveddata_bytes }}
      cache_namespace: ${{ steps.cache-key.outputs.namespace }}
      cache_key: ${{ steps.cache-key.outputs.key }}
      save_seconds: ${{ steps.save_elapsed.outputs.seconds }}
      source_sha: ${{ steps.benchmark.outputs.source_sha }}
      toolchain: ${{ steps.benchmark.outputs.toolchain }}
      iphoneos_sdk: ${{ steps.benchmark.outputs.iphoneos_sdk }}
      payload_sha: ${{ steps.benchmark.outputs.payload_sha }}
      ipa_sha: ${{ steps.benchmark.outputs.ipa_sha }}
      ipa_bytes: ${{ steps.benchmark.outputs.ipa_bytes }}
    steps:
      - name: Checkout the same commit for cold and warm builds
        if: ${{ inputs.mode == 'same' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Checkout the seed parent for the cold build
        if: ${{ inputs.mode == 'adjacent' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.seed_sha }}
      - name: Report Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Compute toolchain-scoped cache key
        id: cache-key
        shell: bash
        env:
          BENCHMARK_MODE: ${{ inputs.mode }}
          CANDIDATE_SHA: ${{ github.sha }}
          SEED_INPUT: ${{ inputs.seed_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$BENCHMARK_MODE" == same ]]; then
            [[ "$actual_sha" == "$CANDIDATE_SHA" ]] || {
              echo "same mode checked out $actual_sha instead of $CANDIDATE_SHA" >&2
              exit 1
            }
            expected_seed="$actual_sha"
          elif [[ "$BENCHMARK_MODE" == adjacent ]]; then
            [[ "$SEED_INPUT" =~ ^[0-9a-f]{40}$ ]] || {
              echo "adjacent mode requires a full lowercase seed_sha" >&2
              exit 1
            }
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "candidate SHA is not a full lowercase commit SHA" >&2
              exit 1
            }
            [[ "$actual_sha" == "$SEED_INPUT" ]] || {
              echo "seed checkout is $actual_sha instead of $SEED_INPUT" >&2
              exit 1
            }
            [[ "$(git rev-parse "$CANDIDATE_SHA^")" == "$actual_sha" ]] || {
              echo "adjacent seed must be the candidate's direct parent" >&2
              exit 1
            }
            expected_seed="$SEED_INPUT"
          else
            echo "unsupported benchmark mode: $BENCHMARK_MODE" >&2
            exit 1
          fi
          namespace="$(python3 scripts/cache-benchmark-identity.py)"
          if [[ "$BENCHMARK_MODE" == same ]]; then
            cache_key="${namespace}-${actual_sha}-run${{ github.run_id }}-attempt${{ github.run_attempt }}"
          else
            cache_key="${namespace}-adjacent-seed${expected_seed}-candidate${CANDIDATE_SHA}-run${{ github.run_id }}-attempt${{ github.run_attempt }}"
          fi
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "source_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "key=$cache_key" >> "$GITHUB_OUTPUT"
          echo "## Cache identity" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$cache_key" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Run cold build with exact source gates
        id: benchmark
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.cache-key.outputs.source_sha }}
        run: bash scripts/cache-benchmark.sh cold
      - name: Start cache save timer
        id: save_start
        shell: bash
        run: echo "ns=$(python3 -c 'import time; print(time.monotonic_ns())')" >> "$GITHUB_OUTPUT"
      - name: Reject oversized cache before upload
        shell: bash
        env:
          DERIVEDDATA_BYTES: ${{ steps.benchmark.outputs.deriveddata_bytes }}
        run: |
          set -euo pipefail
          test "$DERIVEDDATA_BYTES" -le 3221225472
      - name: Save measured DerivedData cache
        id: save_cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-ipa-derived
          key: ${{ steps.cache-key.outputs.key }}
      - name: Record cache save wall time
        id: save_elapsed
        shell: bash
        env:
          START_NS: ${{ steps.save_start.outputs.ns }}
        run: |
          set -euo pipefail
          python3 - "$START_NS" <<'PY'
          import os
          import sys
          import time

          seconds = (time.monotonic_ns() - int(sys.argv[1])) / 1e9
          print(f"Cache save wall time: {seconds:.3f}s")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"seconds={seconds:.3f}\n")
          PY
  warm:
    name: Restore cache and rebuild
    needs: cold
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Report Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify deterministic cold cache identity
        id: cache-key
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_NAMESPACE: ${{ needs.cold.outputs.cache_namespace }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$CANDIDATE_SHA" ]] || {
            echo "candidate checkout is $actual_sha instead of $CANDIDATE_SHA" >&2
            exit 1
          }
          python3 scripts/cache-benchmark-identity.py
      - name: Start cache restore timer
        id: restore_start
        shell: bash
        run: echo "ns=$(python3 -c 'import time; print(time.monotonic_ns())')" >> "$GITHUB_OUTPUT"
      - name: Restore exact cold cache and time transfer
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hermes-ipa-derived
          key: ${{ needs.cold.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Record cache restore wall time
        id: restore_elapsed
        shell: bash
        env:
          START_NS: ${{ steps.restore_start.outputs.ns }}
        run: |
          set -euo pipefail
          python3 - "$START_NS" <<'PY'
          import os
          import sys
          import time

          seconds = (time.monotonic_ns() - int(sys.argv[1])) / 1e9
          print(f"Cache restore wall time: {seconds:.3f}s")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"seconds={seconds:.3f}\n")
          PY
      - name: Run warm build with complete verification
        id: benchmark
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/cache-benchmark.sh warm
      - name: Compare payloads and report net time
        shell: bash
        env:
          CACHE_BENCHMARK_MODE: ${{ inputs.mode }}
          EXPECTED_COLD_SHA: ${{ needs.cold.outputs.source_sha }}
          EXPECTED_WARM_SHA: ${{ steps.benchmark.outputs.source_sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          SEED_SHA: ${{ inputs.seed_sha }}
          DERIVEDDATA_BYTES: ${{ needs.cold.outputs.deriveddata_bytes }}
          SAVE_SECONDS: ${{ needs.cold.outputs.save_seconds }}
          RESTORE_SECONDS: ${{ steps.restore_elapsed.outputs.seconds }}
          COLD_SOURCE_SHA: ${{ needs.cold.outputs.source_sha }}
          COLD_TOOLCHAIN: ${{ needs.cold.outputs.toolchain }}
          COLD_SDK: ${{ needs.cold.outputs.iphoneos_sdk }}
          COLD_BUILD_SECONDS: ${{ needs.cold.outputs.build_seconds }}
          COLD_PAYLOAD_SHA: ${{ needs.cold.outputs.payload_sha }}
          COLD_IPA_SHA: ${{ needs.cold.outputs.ipa_sha }}
          COLD_IPA_BYTES: ${{ needs.cold.outputs.ipa_bytes }}
          COLD_DERIVEDDATA_KIB: ${{ needs.cold.outputs.deriveddata_kib }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/benchmark-result"
          python3 - <<'PY'
          import json
          import os

          cold = {
              "mode": "cold",
              "source_sha": os.environ["COLD_SOURCE_SHA"],
              "toolchain": os.environ["COLD_TOOLCHAIN"],
              "iphoneos_sdk": os.environ["COLD_SDK"],
              "build_seconds": float(os.environ["COLD_BUILD_SECONDS"]),
              "payload_sha256": os.environ["COLD_PAYLOAD_SHA"],
              "ipa_sha256": os.environ["COLD_IPA_SHA"],
              "ipa_bytes": int(os.environ["COLD_IPA_BYTES"]),
              "deriveddata_kib": int(os.environ["COLD_DERIVEDDATA_KIB"]),
          }
          path = os.path.join(
              os.environ["RUNNER_TEMP"], "benchmark-result", "cold.json"
          )
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(cold, stream, ensure_ascii=False, indent=2)
          PY
          python3 scripts/compare-cache-benchmark.py \
            "$RUNNER_TEMP/benchmark-result/cold.json" \
            "$RUNNER_TEMP/hermes-cache-benchmark/result.json" \
            "$DERIVEDDATA_BYTES" "$SAVE_SECONDS" "$RESTORE_SECONDS"

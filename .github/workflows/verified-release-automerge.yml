name: HermesBuild release auto-merge

# Trusted main code: publish a buildable candidate without quality/Issue gates.
# Diagnostics run independently and may fail without delaying promotion.
on:
  workflow_run:
    workflows:
      - HermesBuild single-build candidate
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: hermes-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  merge-and-dispatch:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Promote same-repository product PR from compiled candidate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const sha = context.payload.workflow_run?.head_sha;
            const skip = reason => { core.notice('Not a new product release: ' + reason); return; };
            if (!sha) return skip('candidate HEAD missing');
            const {data: linked} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: sha, per_page: 100
            });
            const candidates = linked.filter(p => p.state === 'open' && p.base.ref === 'main' &&
              p.head.sha === sha && p.head.repo?.full_name === `${owner}/${repo}`);
            if (candidates.length !== 1) return skip('no unique open same-repository PR');
            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: candidates[0].number
            });
            if (pr.head.sha !== sha || pr.base.ref !== 'main' || pr.state !== 'open')
              return skip('PR changed');

            // Keep privileged CI/GitHub-token scripts out of automatic product
            // merges; this is a trust boundary, not a test-quality gate.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const allowed = path =>
              path === 'release.json' || path === 'tests/release-batch-acceptance.json' ||
              path === 'README.md' || path === 'Resources/Info.plist' ||
              path === 'ios-ci-project.yml' ||
              path.startsWith('Sources/HermesShell/') ||
              path.startsWith('UITests/') || path.startsWith('Vendor/Textual/') ||
              (path.startsWith('tests/') && !path.startsWith('tests/releaseautomation/') &&
               !path.startsWith('tests/sourcegate/') && !path.startsWith('tests/baseline-') &&
               !path.includes('/.github/') && (path.endsWith('.swift') || path.endsWith('.sh') ||
               /^tests\\/release-scope-build\\d+\\.json$/.test(path)));
            if (!files.length || files.some(file => !allowed(file.filename)))
              return skip('privileged or maintenance-only PR');
            if (!files.some(file => file.filename === 'release.json'))
              return skip('no new version');

            const readRelease = async ref => {
              const {data} = await github.rest.repos.getContent({
                owner, repo, path: 'release.json', ref
              });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            const next = await readRelease(sha), old = await readRelease(pr.base.sha);
            const valid = item => /^\\d+\\.\\d+\\.\\d+$/.test(item.version) &&
              /^[1-9]\\d*$/.test(String(item.build));
            if (!valid(next) || !valid(old) || Number(next.build) <= Number(old.build))
              return skip('not an increasing valid release identity');
            if (next.version.split('.').map(Number).some((n,i) =>
                n < old.version.split('.').map(Number)[i] &&
                next.version.split('.').map(Number).slice(0,i).every((v,j) =>
                  v === old.version.split('.').map(Number)[j])))
              return skip('version downgrade');

            // IPA exists because the separate candidate-only workflow succeeded.
            // No matrix, source inventory, diagnostic, Issue or reviewer gate.
            const {data: candidateRun} = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.payload.workflow_run.id
            });
            if (candidateRun.head_sha !== sha || candidateRun.conclusion !== 'success')
              return skip('compiled candidate not successful');
            const {data: main} = await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            });
            if (main.commit.sha !== pr.base.sha)
              return skip('main moved; rebase product PR');
            if (pr.draft) {
              await github.graphql(
                'mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){clientMutationId}}',
                {id: pr.node_id}
              );
            }
            const merged = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number, sha, merge_method: 'squash',
              commit_title: `release(iOS): Hermes ${next.version} build${next.build}`
            });
            if (!merged.data.merged || !merged.data.sha)
              throw new Error('Product merge was not confirmed');
            core.info('Merged product PR #' + pr.number + ': ' + merged.data.sha);
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'hermesshell-single-promote.yml', ref: 'main',
              inputs: {expected_sha: merged.data.sha, previous_sha: pr.base.sha}
            });
            core.info('Dispatched immutable IPA publication');

name: GPT cloud branch IPA v2

on:
  push:
    branches:
      - 'gpt/**'

permissions:
  contents: read

concurrency:
  group: gpt-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: GPT source gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify current source and GPT branch contract
        run: bash scripts/gpt-cloud-build.sh source

  offline:
    name: GPT Swift offline regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run complete Swift offline regression
        env:
          HERMES_TEST_JOBS: "4"
        run: bash scripts/gpt-cloud-build.sh offline

  ipa:
    name: GPT unsigned iPhoneOS arm64 IPA
    needs: [source, offline]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize GPT diagnostics
        run: mkdir -p "$RUNNER_TEMP/gpt-cloud"
      - name: Install and record XcodeGen
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/gpt-cloud/setup.started"
          (command -v xcodegen >/dev/null || brew install xcodegen) 2>&1 | tee "$RUNNER_TEMP/gpt-cloud/setup.log"
          xcodegen --version 2>&1 | tee -a "$RUNNER_TEMP/gpt-cloud/setup.log"
          date +%s > "$RUNNER_TEMP/gpt-cloud/setup.finished"
      - name: Build and validate exact branch IPA
        id: build
        shell: bash
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/gpt-cloud/build.started"
          bash scripts/gpt-cloud-build.sh ipa 2>&1 | tee "$RUNNER_TEMP/gpt-cloud/build.log"
          date +%s > "$RUNNER_TEMP/gpt-cloud/build.finished"
      - name: Report success or failure with diagnostics
        if: always()
        env:
          GPT_SETUP_RESULT: ${{ steps.setup.outcome }}
          GPT_BUILD_RESULT: ${{ steps.build.outcome }}
        run: python3 scripts/gpt-cloud-report.py
      - name: Upload verified candidate and provenance
        if: success()
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: gpt-cloud-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.ipa
            release/build-info.json
            release/validation.json
            release/SHA256SUMS.txt
            release/gpt-cloud-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostic logs even after failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpt-cloud-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gpt-cloud/*
            ${{ runner.temp }}/hermes-ios-release.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record uploaded branch-only artifact
        if: success()
        run: |
          {
            echo "- Candidate artifact ID: ${{ steps.upload.outputs.artifact-id }}"
            echo "- Candidate: ${{ steps.upload.outputs.artifact-url }}"
            echo "- No GitHub Release or device signing was performed."
          } >> "$GITHUB_STEP_SUMMARY"

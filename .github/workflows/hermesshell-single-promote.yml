name: HermesBuild promote verified candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Verified merge commit SHA"
        required: true
        type: string
      previous_sha:
        description: "Main SHA before merge"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-single-promote-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Check for a new release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        run: python3 scripts/release-plan.py

  promote:
    name: Download candidate and publish without recompiling
    if: ${{ needs.plan.outputs.release == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      release_url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select the merged PR candidate
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/select-candidate.py > "$RUNNER_TEMP/candidate-selection.json"
          cat "$RUNNER_TEMP/candidate-selection.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the exact candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.select.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.select.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ steps.select.outputs.artifact_name }}
          DOWNLOAD_DIR: ${{ runner.temp }}/hermes-candidate-release
        run: |
          set -euo pipefail
          mkdir -p "$DOWNLOAD_DIR"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/candidate-artifact.zip"
          actual_digest="sha256:$(sha256sum "$RUNNER_TEMP/candidate-artifact.zip" | cut -d' ' -f1)"
          test "$actual_digest" = "$ARTIFACT_DIGEST"
          unzip -q "$RUNNER_TEMP/candidate-artifact.zip" -d "$DOWNLOAD_DIR"
          python3 scripts/verify-candidate.py "$DOWNLOAD_DIR"

      - name: Publish the same candidate bytes
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-candidate.py \
            "$RUNNER_TEMP/hermes-candidate-release" \
            "$RUNNER_TEMP/candidate-selection.json"

  notify:
    name: Bark promotion result
    if: >-
      ${{ always() && needs.plan.outputs.release == 'true' &&
          (needs.promote.result == 'success' || needs.promote.result == 'failure') }}
    needs: [plan, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          BARK_URL: ${{ secrets.BARK_URL }}
          HERMES_RELEASE_URL: ${{ needs.promote.outputs.release_url }}
          HERMES_RELEASE_RESULT: ${{ needs.promote.result }}
        run: |
          if [[ "$HERMES_RELEASE_RESULT" == success && -n "$HERMES_RELEASE_URL" ]]; then
            bash ci/notify-release-bark.sh success
          else
            bash ci/notify-release-bark.sh failure
          fi

  issue-sync:
    name: Sync GitHub Issues with verified Release
    if: ${{ needs.promote.result == 'success' }}
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Mark released PR references in Issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const {data: prs} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha, per_page: 100
            });
            const matches = prs.filter(p => p.merged_at && p.merge_commit_sha === context.sha);
            if (matches.length !== 1) return core.warning('No unique merged PR; skipping issue sync');
            const pr = matches[0], body = pr.body || '';
            const refs = [...new Set([...body.matchAll(/#([1-9][0-9]*)(?![0-9])/g)]
              .map(x => Number(x[1])))].slice(0,20);
            const fixes = new Set([...body.matchAll(/(?:^|[^A-Za-z])(?:fix(?:es|ed)?|close[sd]?|resolve[sd]?) +#([1-9][0-9]*)(?![0-9])/gi)]
              .map(x => Number(x[1])));
            const {data: raw} = await github.rest.repos.getContent({owner, repo, path:'release.json', ref: context.sha});
            const {version, build} = JSON.parse(Buffer.from(raw.content,'base64').toString('utf8'));
            const url = `https://github.com/${owner}/${repo}/releases/tag/release-${version}-build${build}`;
            for (const number of refs) {
              let issue;
              try {
                ({data: issue} = await github.rest.issues.get({owner, repo, issue_number:number}));
              } catch (err) {
                if (err.status === 404) continue;
                throw err;
              }
              if (issue.pull_request) continue;
              const marker = `<!-- hermes-release:${context.sha}:${number} -->`;
              const comments = await github.paginate(github.rest.issues.listComments,
                {owner, repo, issue_number:number, per_page:100});
              if (!comments.some(c => (c.body || '').includes(marker))) {
                await github.rest.issues.createComment({owner, repo, issue_number:number,
                  body: `${marker}Included in [Hermes ${version}/build${build}](${url}) via PR #${pr.number}. ${fixes.has(number) ? 'Explicitly marked resolved by the release PR.' : 'Related changes shipped; remaining acceptance criteria stay open.'}`});
              }
              if (fixes.has(number) && issue.state !== 'closed')
                await github.rest.issues.update({owner,repo,issue_number:number,state:'closed',state_reason:'completed'});
            }

  # GitHub_TOKEN-created Release events do not start ordinary release workflows.
  # Explicit dispatch launches the independent, post-release UI discovery run.
  ui-discovery:
    name: Dispatch post-release simulator discovery
    if: ${{ needs.promote.result == 'success' }}
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted main simulator tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run simulator-probe.yml --repo "$GITHUB_REPOSITORY" --ref main -f suite=all

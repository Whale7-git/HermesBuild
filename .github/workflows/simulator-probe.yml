name: Hermes iOS Simulator UI regression

# No PR, schedule or Release gate. Code and XCTest harness are trusted main.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "bootstrap first; gold1 next; then selected product regressions"
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, gold1, gold2, gold3, gold4, gold, recovery, interaction, all]
      source_sha:
        description: "Exact released/ancestor product commit; empty = dispatch HEAD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-ui-simulator-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  simulator:
    name: iOS ${{ inputs.suite }} / exact-source verification
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout trusted verification harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source SHA and preserve product / harness boundaries
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
          HARNESS_SHA: ${{ github.sha }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$(git -C product rev-parse HEAD)" == "$REQUESTED_SHA" ]] || exit 2
          [[ "$(git -C harness rev-parse HEAD)" == "$HARNESS_SHA" ]] || exit 2
          git -C harness merge-base --is-ancestor "$REQUESTED_SHA" "$HARNESS_SHA" || {
            echo "Requested source is not an ancestor of trusted main"; exit 2;
          }
          echo "SOURCE_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"
          echo "HARNESS_SHA=$HARNESS_SHA" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hermes-ui-verification"
          python3 - <<'PY'
          import json, os, pathlib
          result = {"schema": 2, "run_id": os.environ["GITHUB_RUN_ID"],
                    "source_sha": os.environ["REQUESTED_SHA"],
                    "harness_sha": os.environ["HARNESS_SHA"],
                    "suite": os.environ["SUITE"], "outcome": "INFRA_ERROR",
                    "cases": [], "reason": "setup or simulator compilation did not finish"}
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hermes-ui-verification" / "simulator-report.json"
          p.write_text(json.dumps(result, ensure_ascii=False), encoding="utf-8")
          PY
          echo "Source SHA: $REQUESTED_SHA"
          echo "Harness SHA: $HARNESS_SHA"

      - name: Toolchain and test fixture self-check
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          (command -v xcodegen >/dev/null || brew install xcodegen)
          xcodegen --version
          xcodebuild -version
          xcrun simctl list runtimes
          python3 -m unittest discover -s ../harness/tests/uitest -p 'test_*.py' -v

      - name: Launch isolated loopback mock Gateway
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          python3 ../harness/tests/uitest/mock_gateway.py --port 8765 \
            > "$RUNNER_TEMP/mock-gateway.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock.pid"
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8765/api/sessions > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          echo "Mock Gateway failed to start"
          exit 2

      - name: Select iPhone Simulator and stage trusted UI tests
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c \
            'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in sorted(d.items()) if "iOS" in r for x in v if x.get("isAvailable") and "iPhone" in x["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          # Overlay trusted tests/fixture only. App sources and resources stay
          # the immutable product commit; modified test files are not app code.
          rm -rf UITests tests/uitest
          cp -R ../harness/UITests UITests
          cp -R ../harness/tests/uitest tests/uitest
          cp Resources/Info.plist "$RUNNER_TEMP/HermesSimulator-Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.whale7.hermes" \
            "$RUNNER_TEMP/HermesSimulator-Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string HermesShell" \
            "$RUNNER_TEMP/HermesSimulator-Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" \
            "$RUNNER_TEMP/HermesSimulator-Info.plist"
          cat > "$RUNNER_TEMP/HermesSimulator.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key><string>com.whale7.hermes</string>
            <key>keychain-access-groups</key>
            <array><string>com.whale7.hermes</string></array>
          </dict>
          </plist>
          PLIST
          python3 - <<'PY'
          import os
          from pathlib import Path
          spec = Path("ios-ci-project.yml")
          original = spec.read_text(encoding="utf-8")
          old = "INFOPLIST_FILE: Resources/Info.plist"
          assert original.count(old) == 1
          temp = os.environ["RUNNER_TEMP"]
          new = (f"INFOPLIST_FILE: {temp}/HermesSimulator-Info.plist\n"
                 f"        CODE_SIGN_ENTITLEMENTS: {temp}/HermesSimulator.entitlements")
          spec.write_text(original.replace(old, new), encoding="utf-8")
          PY
          xcodegen generate --spec ios-ci-project.yml
          echo "Exact product commit: $(git rev-parse HEAD)"
          echo "Simulator UDID: $DEVICE"

      - name: Compile simulator XCTest program once
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project HermesShellCI.xcodeproj -scheme HermesShell \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/hermes-ui-derived" \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES \
            2>&1 | tee "$RUNNER_TEMP/hermes-ui-verification/build-for-testing.log"
          XCTESTRUN=$(find "$RUNNER_TEMP/hermes-ui-derived/Build/Products" \
            -maxdepth 1 -name '*.xctestrun' -print -quit)
          [[ -n "$XCTESTRUN" && -f "$XCTESTRUN" ]] || { echo "No xctestrun file"; exit 2; }
          echo "XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"

      - name: Execute isolated real-gesture XCTest cases
        id: ui_tests
        shell: bash
        working-directory: product
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          python3 ../harness/scripts/verify_ios_simulator.py \
            --suite "$REQUESTED_SUITE" --device "$DEVICE" --xctestrun "$XCTESTRUN" \
            --source-sha "$SOURCE_SHA" --harness-sha "$HARNESS_SHA" \
            --output "$RUNNER_TEMP/hermes-ui-verification"

      - name: Summarize same-SHA verification
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"hermes-ui-verification"/"simulator-report.json"
          print("## Hermes simulator validation (nonblocking)")
          if not p.is_file():
              print("INFRA_ERROR: report unavailable")
          else:
              v=json.loads(p.read_text())
              print(f"- Product SHA: {v.get('source_sha', 'unverified')}")
              print(f"- Harness SHA: {v.get('harness_sha', 'unverified')}")
              print(f"- Suite: {v.get('suite', 'unverified')}")
              print(f"- Outcome: {v.get('outcome', 'INFRA_ERROR')}")
              print("| Test | Outcome | Stage |")
              print("| --- | --- | --- |")
              for case in v.get("cases", []):
                  print(f"| {case['test']} | {case['status']} | {case.get('failure_stage', '-') } |")
              print("\nResults never act as an IPA/Release gate.")
          PY

      - name: Upload compact verification verdict for trusted Issue triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ui-triage-${{ github.run_id }}-verification
          path: ${{ runner.temp }}/hermes-ui-verification/simulator-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve XCTest results, failure screenshots and fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ui-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hermes-ui-verification
            ${{ runner.temp }}/mock-gateway.log
          if-no-files-found: warn
          retention-days: 7

      - name: Shutdown local fixture and simulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mock.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/mock.pid")" 2>/dev/null || true
          fi
          xcrun simctl shutdown all || true

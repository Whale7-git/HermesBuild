name: simulator-probe

# Read-only probe: can a GitHub-hosted macos-26 runner boot an iOS Simulator?
# Nothing here touches the release chain. Delete this file once answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Toolchain
        run: |
          set -x
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: Installed runtimes
        run: xcrun simctl list runtimes

      - name: Available devices
        run: xcrun simctl list devices available

      - name: Boot a simulator and screenshot it
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(i["udid"] for r,v in sorted(d.items()) if "iOS" in r for i in v if i.get("isAvailable") and "iPhone" in i["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "picked device: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl list devices | grep -i booted || true
          sleep 5
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/probe.png"
          ls -l "$RUNNER_TEMP/probe.png"
          file "$RUNNER_TEMP/probe.png"

      - name: Prove the device runs code
        run: |
          set -euo pipefail
          xcrun simctl spawn "$DEVICE" launchctl list | head -5
          xcrun simctl getenv "$DEVICE" HOME

      - name: Shutdown
        if: always()
        run: xcrun simctl shutdown all || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-probe-screenshot
          path: ${{ runner.temp }}/probe.png
          if-no-files-found: warn
          retention-days: 3

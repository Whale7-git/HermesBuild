name: Hermes iOS Simulator UI regression

# Real UI regression for iOS-affecting pull requests, plus manual/scheduled probes.
# Separate from candidate IPA building; this workflow never publishes an IPA.
on:
  pull_request:
    branches: [main]
    paths:
      - 'Sources/HermesShell/**'
      - 'Vendor/Textual/**'
      - 'UITests/**'
      - 'ios-ci-project.yml'
      - 'Resources/Info.plist'
      - 'release.json'
      - '.github/workflows/simulator-probe.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: "gold, audit, or all"
        required: false
        default: all
        type: choice
        options: [gold, audit, all]
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
  statuses: write

concurrency:
  group: hermes-ui-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    name: simulator-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [chat, experience]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Pin simulator source and status to the same PR HEAD, not a synthetic
          # pull_request merge ref (which can hide head-specific regressions).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Toolchain and XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          (command -v xcodegen >/dev/null || brew install xcodegen)
          xcodegen --version
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Launch isolated mock Gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/uitest -p 'test_*.py' -v
          python3 tests/uitest/mock_gateway.py --port 8765 > "$RUNNER_TEMP/mock-gateway.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/api/sessions >/dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:8765/api/sessions | python3 -m json.tool

      - name: Select and boot available iOS iPhone
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(i["udid"] for r,v in sorted(d.items()) if "iOS" in r for i in v if i.get("isAvailable") and "iPhone" in i["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Generate UI test project with simulator-only bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          # The production Info.plist intentionally lacks CFBundleIdentifier.
          # Simulator installation requires it; never mutate the checked-in plist.
          cp Resources/Info.plist "$RUNNER_TEMP/HermesSimulator-Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.whale7.hermes" "$RUNNER_TEMP/HermesSimulator-Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string HermesShell" "$RUNNER_TEMP/HermesSimulator-Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$RUNNER_TEMP/HermesSimulator-Info.plist"
          # Simulator-only access group; do not modify product App entitlements.
          cat > "$RUNNER_TEMP/HermesSimulator.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key><string>com.whale7.hermes</string>
            <key>keychain-access-groups</key>
            <array><string>com.whale7.hermes</string></array>
          </dict>
          </plist>
          PLIST
          python3 - <<'PY'
          import os
          from pathlib import Path
          spec = Path("ios-ci-project.yml")
          original = spec.read_text(encoding="utf-8")
          old = "INFOPLIST_FILE: Resources/Info.plist"
          assert original.count(old) == 1
          temp = os.environ["RUNNER_TEMP"]
          replacement = (f"INFOPLIST_FILE: {temp}/HermesSimulator-Info.plist\n"
                         f"        CODE_SIGN_ENTITLEMENTS: {temp}/HermesSimulator.entitlements")
          spec.write_text(original.replace(old, replacement), encoding="utf-8")
          PY
          xcodegen generate --spec ios-ci-project.yml

      - name: Run real iOS UI gestures
        id: ui_gestures
        shell: bash
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.suite || 'all' }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$REQUESTED_SUITE:$TEST_SHARD" in
            all:chat) selection="-only-testing:HermesUITests/HermesGoldUITests -only-testing:HermesUITests/HermesChatSelectionGestureUITests -only-testing:HermesUITests/HermesComposerStabilityUITests -only-testing:HermesUITests/HermesLongTaskRecoveryUITests" ;;
            all:experience) selection="-only-testing:HermesUITests/HermesAccessibilityUITests -only-testing:HermesUITests/HermesRealChatDynamicTypeUITests -only-testing:HermesUITests/HermesSentImagePreviewUITests" ;;
            gold:*) selection="-only-testing:HermesUITests/HermesGoldUITests" ;;
            audit:*) selection="-only-testing:HermesUITests/HermesAccessibilityUITests" ;;
            *) echo "Unsupported suite/shard $REQUESTED_SUITE:$TEST_SHARD" >&2; exit 2 ;;
          esac
          xcodebuild test \
            -project HermesShellCI.xcodeproj \
            -scheme HermesShell \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/HermesUITests.xcresult" \
            $selection CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-ui.log"
          echo "### Hermes iOS UI: $REQUESTED_SUITE / $TEST_SHARD" >> "$GITHUB_STEP_SUMMARY"
          echo "Simulator: $DEVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "xcodebuild UI suite: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract structured XCTest diagnostics
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/HermesUITests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/HermesUITests.xcresult" \
              > "$RUNNER_TEMP/ui-test-summary.json" || true
            xcrun xcresulttool get test-results tests \
              --path "$RUNNER_TEMP/HermesUITests.xcresult" \
              > "$RUNNER_TEMP/ui-test-cases.json" || true
            # Export actual failed-test screenshots for source-backed triage.
            # Keep the xcresult even if this extraction command is unavailable.
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/HermesUITests.xcresult" \
              --output-path "$RUNNER_TEMP/ui-attachments" \
              --only-failures || true
          fi

      # Compact and bounded test evidence is consumed by a trusted main-only
      # workflow_run triager. Never give PR-controlled scripts an Issues token.
      - name: Prepare structured simulator evidence
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.ui_gestures.outcome }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "xcodebuild-ui.log"
          text = log.read_text(errors="replace") if log.exists() else ""
          failed = sorted(set(
              suite + "." + test for suite, test in re.findall(
                  r"Test Case '-\[[^ ]+\.([A-Za-z_][A-Za-z_0-9]*) (test[A-Za-z_0-9]+)\]' failed",
                  text)))
          lines = []
          for line in text.splitlines():
              if ("error:" in line and "UITests" in line and "XCTAssert" in line):
                  line = re.sub(r"(?i)(bearer\s+|token[=:]\s*)\S+", r"\1[redacted]", line)
                  lines.append(line[-350:])
          outcome = os.environ["TEST_OUTCOME"]
          report = {"schema": 1, "shard": os.environ["TEST_SHARD"],
                    "run_id": os.environ["TEST_RUN"], "sha": os.environ["TEST_SHA"],
                    "outcome": outcome, "failed_tests": failed[:30],
                    "assertions": lines[-15:]}
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "simulator-report.json"
          out.write_text(json.dumps(report, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Upload compact simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ui-triage-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/simulator-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Record exact-commit simulator gold result
        if: always()
        shell: bash
        env:
          UI_OUTCOME: ${{ steps.ui_gestures.outcome }}
          TEST_SUITE: ${{ github.event.inputs.suite || 'all' }}
          STATUS_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_REPO: ${{ github.repository }}
          STATUS_RUN: ${{ github.run_id }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          suite = os.environ["TEST_SUITE"]
          passed = os.environ["UI_OUTCOME"] == "success"
          body = {
              "state": "success" if passed else "failure",
              "context": f"hermes/simulator-{suite}-{os.environ['TEST_SHARD']}",
              "description": f"{suite} UI suite passed" if passed else f"{suite} UI suite did not pass",
              "target_url": ("https://github.com/" + os.environ["STATUS_REPO"]
                             + "/actions/runs/" + os.environ["STATUS_RUN"]),
          }
          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["STATUS_REPO"]
              + "/statuses/" + os.environ["STATUS_SHA"],
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["STATUS_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              print("UI commit status published:", response.status, body["context"], body["state"])
          PY

      - name: Inspect actual simulator signing entitlements
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug-iphonesimulator/HermesShell.app' \
            -type d -print -quit 2>/dev/null || true)
          if [[ -n "$APP" ]]; then
            if codesign -d --entitlements :- "$APP" \
              > "$RUNNER_TEMP/simulator-signed-entitlements.plist" \
              2> "$RUNNER_TEMP/simulator-sign-inspection.log"; then
              echo "Simulator-only Keychain signing entitlements:"
              /usr/libexec/PlistBuddy -c 'Print :application-identifier' \
                "$RUNNER_TEMP/simulator-signed-entitlements.plist" || true
              /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups' \
                "$RUNNER_TEMP/simulator-signed-entitlements.plist" || true
            else
              echo "Simulator App signing/entitlement inspection failed"
            fi
          else
            echo "No simulator app; build failed before producing a bundle"
          fi

      - name: Collect redacted Gateway requests
        if: always()
        shell: bash
        run: |
          curl --max-time 5 --silent http://127.0.0.1:8765/__control/log \
            > "$RUNNER_TEMP/mock-requests.json" || true

      - name: Preserve UI failures and xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ui-evidence-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/HermesUITests.xcresult
            ${{ runner.temp }}/xcodebuild-ui.log
            ${{ runner.temp }}/ui-test-summary.json
            ${{ runner.temp }}/ui-test-cases.json
            ${{ runner.temp }}/ui-attachments
            ${{ runner.temp }}/mock-gateway.log
            ${{ runner.temp }}/mock-requests.json
            ${{ runner.temp }}/simulator-signed-entitlements.plist
            ${{ runner.temp }}/simulator-sign-inspection.log
          if-no-files-found: warn
          retention-days: 7

      - name: Shutdown Simulator and fixture
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mock.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/mock.pid")" 2>/dev/null || true
          fi
          xcrun simctl shutdown all || true

  simulator-result:
    name: Aggregate isolated UI shards
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: simulator
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish exact-HEAD combined UI status
        uses: actions/github-script@v7
        env:
          SHARDS_RESULT: ${{ needs.simulator.result }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const result = process.env.SHARDS_RESULT;
            const passed = result === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: passed ? 'success' : 'failure',
              context: 'hermes/simulator-all',
              description: passed ? 'All isolated iOS simulator shards passed'
                                  : 'One or more iOS simulator shards did not pass',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!passed) core.setFailed('iOS simulator shard result: ' + result);

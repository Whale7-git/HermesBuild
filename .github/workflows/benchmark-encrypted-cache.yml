name: HermesShell encrypted cache + Xcode build diagnostics (retry)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/benchmark-encrypted-cache.yml

permissions:
  contents: read

concurrency:
  group: hermes-encrypted-cache-benchmark-${{ github.run_id }}
  cancel-in-progress: false

env:
  CACHE_KEY: hermes-build162-encrypted-v1-macos15-xcode26.3-sdk26.2-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  cold:
    name: Cold build, compress, encrypt and upload cache
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      build_s: ${{ steps.build.outputs.build_seconds }}
      compress_s: ${{ steps.pack.outputs.compress_seconds }}
      encrypt_s: ${{ steps.pack.outputs.encrypt_seconds }}
      upload_s: ${{ steps.upload_elapsed.outputs.seconds }}
      ipa_sha: ${{ steps.build.outputs.ipa_sha }}
      ipa_bytes: ${{ steps.build.outputs.ipa_bytes }}
      encrypted_bytes: ${{ steps.pack.outputs.encrypted_bytes }}
    steps:
      - name: Checkout public benchmark tooling
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesBuild
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout pinned private HermesShell build162 source
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesShell
          ref: 1e57404cae21f567a67d4e2ce92276c101642908
          path: src
          token: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Check Xcode and prepare dependencies
        shell: bash
        run: bash tooling/ci/benchmark.sh prepare

      - name: Cold compile, verify IPA and capture Xcode task timings
        id: build
        shell: bash
        run: bash tooling/ci/benchmark.sh build cold

      - name: Time zstd compression and AES-256-GCM encryption
        id: pack
        shell: bash
        env:
          HERMESSHELL_CACHE_TOKEN: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
        run: bash tooling/ci/benchmark.sh pack

      - name: Start upload timer
        id: upload_start
        shell: bash
        run: bash tooling/ci/benchmark.sh timer-start

      - name: Cache only AES-256-GCM encrypted DerivedData
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-cache.enc
          key: ${{ env.CACHE_KEY }}

      - name: Record upload elapsed time
        id: upload_elapsed
        shell: bash
        env:
          START_NS: ${{ steps.upload_start.outputs.ns }}
        run: bash tooling/ci/benchmark.sh timer-stop UPLOAD

  warm:
    name: Download, decrypt, decompress and warm build
    needs: cold
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout public benchmark tooling
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesBuild
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout pinned private HermesShell build162 source
        uses: actions/checkout@v4
        with:
          repository: Whale7-git/HermesShell
          ref: 1e57404cae21f567a67d4e2ce92276c101642908
          path: src
          token: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Check identical Xcode toolchain
        shell: bash
        run: bash tooling/ci/benchmark.sh prepare

      - name: Start download timer
        id: download_start
        shell: bash
        run: bash tooling/ci/benchmark.sh timer-start

      - name: Restore encrypted DerivedData from the public cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hermes-cache.enc
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Record cache download time and confirm exact cache hit
        id: download_elapsed
        shell: bash
        env:
          START_NS: ${{ steps.download_start.outputs.ns }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [[ "$CACHE_HIT" == "true" ]] || { echo "::error::Missing exact encrypted cache"; exit 1; }
          bash tooling/ci/benchmark.sh timer-stop DOWNLOAD

      - name: Time authenticated decryption and extraction separately
        id: unpack
        shell: bash
        env:
          HERMESSHELL_CACHE_TOKEN: ${{ secrets.HERMESSHELL_READ_RELEASE_TOKEN }}
        run: bash tooling/ci/benchmark.sh unpack

      - name: Warm compile, verify IPA and capture Xcode task timings
        id: build
        shell: bash
        run: bash tooling/ci/benchmark.sh build warm

      - name: Print cold/warm speedup and cache crypto overhead
        shell: bash
        env:
          COLD_BUILD: ${{ needs.cold.outputs.build_s }}
          COMPRESS: ${{ needs.cold.outputs.compress_s }}
          ENCRYPT: ${{ needs.cold.outputs.encrypt_s }}
          UPLOAD: ${{ needs.cold.outputs.upload_s }}
          DOWNLOAD: ${{ steps.download_elapsed.outputs.seconds }}
          DECRYPT: ${{ steps.unpack.outputs.decrypt_seconds }}
          EXTRACT: ${{ steps.unpack.outputs.extract_seconds }}
          WARM_BUILD: ${{ steps.build.outputs.build_seconds }}
          COLD_SHA: ${{ needs.cold.outputs.ipa_sha }}
          WARM_SHA: ${{ steps.build.outputs.ipa_sha }}
          COLD_BYTES: ${{ needs.cold.outputs.ipa_bytes }}
          WARM_BYTES: ${{ steps.build.outputs.ipa_bytes }}
          ENCRYPTED_BYTES: ${{ needs.cold.outputs.encrypted_bytes }}
        run: bash tooling/ci/benchmark.sh report

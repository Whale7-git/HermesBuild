name: HermesBuild single-build candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-candidate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  candidate:
    name: Compile and upload one candidate IPA
    # The whole run must succeed before promotion can select this artifact.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize candidate diagnostics
        run: |
          diagnostics="$RUNNER_TEMP/hermes-candidate-diagnostics"
          export_dir="$RUNNER_TEMP/hermes-candidate-diagnostics-export"
          mkdir -p "$diagnostics" "$export_dir"
          echo "HERMES_DIAGNOSTICS_DIR=$diagnostics" >> "$GITHUB_ENV"
          echo "HERMES_DIAGNOSTICS_EXPORT_DIR=$export_dir" >> "$GITHUB_ENV"

      - name: Install XcodeGen and capture setup timing
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          date +%s > "$HERMES_DIAGNOSTICS_DIR/setup.started"
          (command -v xcodegen >/dev/null || brew install xcodegen) \
            2>&1 | tee "$HERMES_DIAGNOSTICS_DIR/setup.log"
          xcodegen --version 2>&1 | tee -a "$HERMES_DIAGNOSTICS_DIR/setup.log"
          date +%s > "$HERMES_DIAGNOSTICS_DIR/setup.finished"

      - name: Capture Apple toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-version
          python3 scripts/capture-candidate-toolchain.py \
            "$HERMES_DIAGNOSTICS_DIR/toolchain.json"

      - name: Compute candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          build="$(python3 -c 'import json; print(json.load(open("release.json"))["build"])')"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$(git hash-object .github/workflows/hermesshell-single-build.yml)" >> "$GITHUB_OUTPUT"
          echo "artifact=hermes-candidate-${version}-build${build}-tree${tree}" >> "$GITHUB_OUTPUT"

      - name: Build one immutable candidate
        id: build
        env:
          HERMES_EVENT_NAME: ${{ github.event_name }}
          HERMES_RUN_ID: ${{ github.run_id }}
          HERMES_RUN_ATTEMPT: ${{ github.run_attempt }}
          HERMES_WORKFLOW_PATH: .github/workflows/hermesshell-single-build.yml
          HERMES_WORKFLOW_BLOB_SHA: ${{ steps.identity.outputs.workflow_sha }}
          HERMES_CANDIDATE_DIR: ${{ runner.temp }}/hermes-candidate-release
          HERMES_DERIVED_DATA: ${{ runner.temp }}/hermes-main-ipa-derived
          HERMES_XCODE_LOG: ${{ runner.temp }}/hermes-candidate-diagnostics/xcodebuild.log
        run: |
          set -euo pipefail
          date +%s > "$HERMES_DIAGNOSTICS_DIR/build.started"
          if bash scripts/github-build-ipa-main.sh \
              2>&1 | tee "$HERMES_DIAGNOSTICS_DIR/build.log"; then
            build_status=success
          else
            build_status=failure
          fi
          date +%s > "$HERMES_DIAGNOSTICS_DIR/build.finished"
          test "$build_status" = success

      - name: Enforce candidate pull-request identity
        id: enforce
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/hermes-candidate-release
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - "$CANDIDATE_DIR" "$EXPECTED_RUN_ID" "$EXPECTED_RUN_ATTEMPT" <<'PY'
          import json
          import pathlib
          import sys
          root, expected_run, expected_attempt = sys.argv[1:]
          manifest = json.loads(
              (pathlib.Path(root) / "candidate-manifest.json").read_text()
          )
          producer = manifest["producer"]
          assert producer["event"] == "pull_request"
          assert producer["run_id"] == expected_run
          assert producer["run_attempt"] == expected_attempt
          PY

      - name: Verify candidate manifest and files
        id: verify
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          python3 scripts/verify-candidate.py \
            "$RUNNER_TEMP/hermes-candidate-release" \
            --expected-tree "$EXPECTED_TREE"

      - name: Upload immutable candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: ${{ runner.temp }}/hermes-candidate-release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 14

      - name: Record candidate result
        id: record
        env:
          ARTIFACT_NAME: ${{ steps.identity.outputs.artifact }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SOURCE_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          {
            echo "### HermesBuild candidate"
            echo
            echo "- Artifact: \`$ARTIFACT_NAME\`"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Source tree: \`$SOURCE_TREE\`"
            echo "- Diagnostics: \`hermes-candidate-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo "- Release publication: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write candidate diagnostics report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          HERMES_SETUP_RESULT: ${{ steps.setup.outcome }}
          HERMES_TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
          HERMES_IDENTITY_RESULT: ${{ steps.identity.outcome }}
          HERMES_BUILD_RESULT: ${{ steps.build.outcome }}
          HERMES_ENFORCE_RESULT: ${{ steps.enforce.outcome }}
          HERMES_VERIFY_RESULT: ${{ steps.verify.outcome }}
          HERMES_UPLOAD_RESULT: ${{ steps.upload.outcome }}
          HERMES_RECORD_RESULT: ${{ steps.record.outcome }}
          HERMES_ARTIFACT_NAME: ${{ steps.identity.outputs.artifact }}
          HERMES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          HERMES_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python3 scripts/write-candidate-report.py \
            "$HERMES_DIAGNOSTICS_DIR" \
            "$RUNNER_TEMP/hermes-candidate-release" \
            "$HERMES_DIAGNOSTICS_EXPORT_DIR"

      - name: Upload candidate diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hermes-candidate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hermes-candidate-diagnostics-export/*
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
